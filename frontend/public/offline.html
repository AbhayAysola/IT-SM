<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Offline | IT-SM</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --border: #e2e8f0; --accent: #1d4fd7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --card: #0f172a; --text: #e2e8f0; --muted: #94a3b8; --border: #1e293b; --accent: #6b8cff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 26rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; text-align: center; }
    img { width: 56px; height: 56px; border-radius: 12px; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>IT-SM needs a connection to show and update incidents. Nothing you did is lost; try again when you are back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
