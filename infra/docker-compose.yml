services:
  postgres:
    image: postgres:16-alpine
    container_name: itsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - itsm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: itsm-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # `dev` allows the non-Secure session cookie below. Remove `dev` (and AUTH_COOKIE_SECURE) for anything served over HTTPS.
      SPRING_PROFILES_ACTIVE: docker,dev
      # Actuator (health, Prometheus) on its own port. It is NOT published below: only containers on itsm-network (Prometheus) reach it.
      MANAGEMENT_SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itsm
      SPRING_DATASOURCE_USERNAME: itsm
      SPRING_DATASOURCE_PASSWORD: itsm_password
      # Required, no default: >= 32 bytes of random secret (e.g. `openssl rand -base64 48`). Export it or put it in infra/.env.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to at least 32 bytes of random secret material}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Local development stack: self-registration on so you can create an account. Set to false anywhere real (security.md).
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # Local plain-HTTP development only: the browser would drop a Secure cookie from http://localhost:3000. Needs the `dev` profile above.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Optional: AI-powered incident categorisation, duplicate hints and the chatbot (Google Gemini). Leave blank to disable.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - itsm-network

  # One-shot: creates the FIRST administrator, then exits. Not started by `up`; run it once after the stack is healthy:
  #   ITSM_BOOTSTRAP_ADMIN_EMAIL=admin@example.com ITSM_BOOTSTRAP_ADMIN_PASSWORD='choose-a-strong-one' \
  #     docker compose --profile bootstrap run --rm bootstrap-admin
  # It refuses when an administrator already exists, so running it twice is harmless.
  bootstrap-admin:
    profiles: ["bootstrap"]
    image: itsm-backend-bootstrap
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["--itsm.bootstrap-admin=true", "--server.port=0", "--management.server.port=0"]
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itsm
      SPRING_DATASOURCE_USERNAME: itsm
      SPRING_DATASOURCE_PASSWORD: itsm_password
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to at least 32 bytes of random secret material}
      ITSM_BOOTSTRAP_ADMIN_EMAIL: ${ITSM_BOOTSTRAP_ADMIN_EMAIL:-}
      ITSM_BOOTSTRAP_ADMIN_PASSWORD: ${ITSM_BOOTSTRAP_ADMIN_PASSWORD:-}
      ITSM_BOOTSTRAP_ADMIN_NAME: ${ITSM_BOOTSTRAP_ADMIN_NAME:-Administrator}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - itsm-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Compiled into the client bundle at build time (a runtime variable would have no effect). Local development: the browser
        # reaches the API on the published port 8080. Rebuild the image (`docker compose up --build`) after changing it.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        # `live` = incidents and notifications come from the backend. `mock` would show browser-only demo data.
        NEXT_PUBLIC_INCIDENTS_API: ${NEXT_PUBLIC_INCIDENTS_API:-live}
    container_name: itsm-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - itsm-network

networks:
  itsm-network:
    driver: bridge
    name: itsm-network

volumes:
  postgres_data:
    driver: local
