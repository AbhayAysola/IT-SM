apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: it-sm
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: it-sm
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "itsm"
  # REPLACE every REPLACE_ME below with a strong value BEFORE applying (the same values as postgres-secret, redis-secret, rabbitmq-secret).
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME_same_as_postgres_secret"
  SPRING_DATA_REDIS_PASSWORD: "REPLACE_ME_same_as_redis_secret"
  SPRING_RABBITMQ_USERNAME: "itsm"
  SPRING_RABBITMQ_PASSWORD: "REPLACE_ME_same_as_rabbitmq_secret"
  JWT_SECRET: "REPLACE_ME_generate_with_openssl_rand_base64_48"  # the backend refuses to start with this placeholder
  JWT_EXPIRATION: "86400000"
