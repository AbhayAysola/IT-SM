apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: it-sm
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: it-sm
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "itsm"
  SPRING_DATASOURCE_PASSWORD: "itsm_password"
  SPRING_DATA_REDIS_PASSWORD: "redis_password"
  SPRING_RABBITMQ_USERNAME: "itsm"
  SPRING_RABBITMQ_PASSWORD: "rabbitmq_password"
  JWT_SECRET: "change-me-in-production-minimum-32-chars-required"
  JWT_EXPIRATION: "86400000"
