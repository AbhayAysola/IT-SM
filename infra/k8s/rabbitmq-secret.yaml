apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: it-sm
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: it-sm
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "itsm"
  # REPLACE_ME: choose a strong password and use the same value in backend-secret.yaml (SPRING_RABBITMQ_PASSWORD).
  RABBITMQ_DEFAULT_PASS: "REPLACE_ME_same_as_backend_secret"
  RABBITMQ_DEFAULT_VHOST: "/"
