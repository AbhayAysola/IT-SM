apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: it-sm
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: it-sm
    app: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
      protocol: TCP
  selector:
    app: frontend
