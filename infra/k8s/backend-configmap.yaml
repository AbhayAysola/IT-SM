apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: it-sm
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: it-sm
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/itsm"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_VHOST: "/"
  SERVER_PORT: "8080"
  # Actuator (probes, /actuator/prometheus) on its own port. No Service exposes it; networkpolicy.yaml limits it to Prometheus and the kubelet.
  MANAGEMENT_SERVER_PORT: "8081"
  # Public self-registration is OFF in production until email verification exists (docs/architecture/security.md).
  REGISTRATION_ENABLED: "false"
  # The ingress is the ONE proxy in front of the backend. Without these two lines every user would appear to come from the ingress
  # pod, and the login/registration rate limits would become one shared limit for everybody. X-Forwarded-For is trusted from these
  # addresses ONLY, so set TRUSTED_PROXIES to your ingress controller's pod CIDR (Kind with scripts/setup-kind.sh: 10.244.0.0/16).
  # networkpolicy.yaml makes sure only the ingress controller can reach the backend. PLACEHOLDER: the backend does not trust any proxy
  # until you replace it (the value below is not a valid address or CIDR, so startup should fail rather than trust a wide range).
  TRUSTED_PROXY_HOPS: "1"
  TRUSTED_PROXIES: "REPLACE_ME_ingress_controller_pod_cidr"
  # The public origin(s) of the web app. REQUIRED for the browser session: cookie-authenticated writes and the web login are refused from
  # any other Origin (even when the web app and API share a host behind the ingress). PLACEHOLDER: replace `it-sm.local` with the host in
  # ingress.yaml (always https://<same host>), and build the frontend image with --build-arg NEXT_PUBLIC_API_URL=<this same origin>.
  CORS_ALLOWED_ORIGINS: "https://it-sm.local"
  # The session cookie is Secure (the default) and the `dev` profile is NOT active, so this deployment is served over HTTPS only
  # (ingress.yaml has the `tls:` section and ssl-redirect). Do not set AUTH_COOKIE_SECURE=false here: the application refuses to start.
