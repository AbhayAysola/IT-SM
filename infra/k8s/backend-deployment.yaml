apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: it-sm
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: it-sm
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: it-sm
        app: backend
    spec:
      containers:
        - name: backend
          image: it-sm/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          # Spring Boot probe groups (backend/src/main/resources/application.yml). Actuator is NOT routed through the ingress (it only forwards
          # /api and /), so these are reachable by the kubelet only.
          #  * startup:   gives boot + Flyway migrations up to 5s x 36 = 180s (200m CPU request) before liveness takes over, so a slow
          #               start is never mistaken for a dead process.
          #  * liveness:  the process itself. Does NOT include PostgreSQL, Redis or RabbitMQ: a dependency outage must not restart pods.
          #  * readiness: accepting traffic AND PostgreSQL answers. Redis/RabbitMQ are not included (P1 uses neither); /actuator/health
          #               still reports them.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
