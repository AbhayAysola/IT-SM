apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: it-sm
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: it-sm
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
      protocol: TCP
  selector:
    app: redis
