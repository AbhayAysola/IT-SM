apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-sm-ingress
  namespace: it-sm
  labels:
    app.kubernetes.io/name: it-sm
    app.kubernetes.io/part-of: it-sm
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: it-sm.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
