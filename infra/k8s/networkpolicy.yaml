# Ingress-only policies (egress is not restricted): the ingress controller reaches the frontend and the backend API; only the backend
# reaches PostgreSQL; and the backend's management port (actuator, Prometheus) is open to Prometheus pods only.
# Needs a CNI that enforces NetworkPolicy (Kind's kindnet does from v0.20; Calico and Cilium do). The kubelet's probe traffic is not affected.
# PLACEHOLDERS: `ingress-nginx` (the ingress controller's namespace) and `monitoring` / `app.kubernetes.io/name: prometheus` (where and how
# your Prometheus runs). Same policies as infra/helm/templates/networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: it-sm
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: it-sm
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: it-sm
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5432
