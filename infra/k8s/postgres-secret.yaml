apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: it-sm
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: it-sm
type: Opaque
stringData:
  POSTGRES_DB: "itsm"
  POSTGRES_USER: "itsm"
  # REPLACE_ME: choose a strong password and use the same value in backend-secret.yaml (SPRING_DATASOURCE_PASSWORD).
  POSTGRES_PASSWORD: "REPLACE_ME_same_as_backend_secret"
