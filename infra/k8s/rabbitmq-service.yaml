apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: it-sm
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: it-sm
    app: rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
      protocol: TCP
    - port: 15672
      targetPort: 15672
      name: management
      protocol: TCP
  selector:
    app: rabbitmq
