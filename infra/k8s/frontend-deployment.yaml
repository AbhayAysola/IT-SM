apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: it-sm
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: it-sm
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: it-sm
        app: frontend
    spec:
      containers:
        - name: frontend
          image: it-sm/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://it-sm.local/api"
            - name: BACKEND_INTERNAL_URL
              value: "http://backend-service:8080"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
