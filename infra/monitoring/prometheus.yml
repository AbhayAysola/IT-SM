global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'it-sm-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # The management port: no credentials needed, and never published outside the compose network / the cluster.
      - targets: ['backend:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
