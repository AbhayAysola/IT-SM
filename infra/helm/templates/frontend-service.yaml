apiVersion: v1
kind: Service
metadata:
  name: {{ include "it-sm.fullname" . }}-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
      name: http
      protocol: TCP
  selector:
    {{- include "it-sm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
