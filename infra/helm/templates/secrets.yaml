apiVersion: v1
kind: Secret
metadata:
  name: {{ include "it-sm.fullname" . }}-postgres-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required" .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "it-sm.fullname" . }}-backend-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ required "postgres.password is required" .Values.postgres.password | quote }}
  JWT_SECRET: {{ required "backend.jwt.secret is required (>= 32 bytes of random secret)" .Values.backend.jwt.secret | quote }}
  JWT_EXPIRATION: {{ .Values.backend.jwt.expiration | quote }}
  GEMINI_API_KEY: {{ .Values.backend.gemini.apiKey | default "" | quote }}
