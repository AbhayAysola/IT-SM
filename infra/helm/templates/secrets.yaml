apiVersion: v1
kind: Secret
metadata:
  name: {{ include "it-sm.fullname" . }}-postgres-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "it-sm.fullname" . }}-redis-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "it-sm.fullname" . }}-rabbitmq-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: {{ .Values.rabbitmq.username | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.rabbitmq.password | quote }}
  RABBITMQ_DEFAULT_VHOST: {{ .Values.rabbitmq.vhost | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "it-sm.fullname" . }}-backend-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgres.password | quote }}
  SPRING_DATA_REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  SPRING_RABBITMQ_USERNAME: {{ .Values.rabbitmq.username | quote }}
  SPRING_RABBITMQ_PASSWORD: {{ .Values.rabbitmq.password | quote }}
  JWT_SECRET: {{ .Values.backend.jwt.secret | quote }}
  JWT_EXPIRATION: {{ .Values.backend.jwt.expiration | quote }}
