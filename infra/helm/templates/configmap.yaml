apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "it-sm.fullname" . }}-backend-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ include "it-sm.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
  SERVER_PORT: {{ .Values.backend.service.port | quote }}
  # Actuator on its own port, never published (see networkpolicy.yaml and docs/architecture/security.md, "Management port").
  MANAGEMENT_SERVER_PORT: {{ .Values.backend.managementPort | quote }}
  REGISTRATION_ENABLED: {{ .Values.backend.registration.enabled | quote }}
  TRUSTED_PROXY_HOPS: {{ .Values.backend.trustedProxy.hops | quote }}
  TRUSTED_PROXIES: {{ required "backend.trustedProxy.cidrs is required: the ingress controller's pod CIDR (Kind: 10.244.0.0/16). X-Forwarded-For is trusted from these addresses only." .Values.backend.trustedProxy.cidrs | quote }}
  CORS_ALLOWED_ORIGINS: {{ default (printf "https://%s" (required "ingress.host is required (or set backend.allowedOrigins)" .Values.ingress.host)) .Values.backend.allowedOrigins | quote }}
