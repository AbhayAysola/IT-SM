apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "it-sm.fullname" . }}-backend-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ include "it-sm.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
  SPRING_DATA_REDIS_HOST: "{{ include "it-sm.fullname" . }}-redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_RABBITMQ_HOST: "{{ include "it-sm.fullname" . }}-rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_VHOST: {{ .Values.rabbitmq.vhost | quote }}
  SERVER_PORT: {{ .Values.backend.service.port | quote }}
  REGISTRATION_ENABLED: {{ .Values.backend.registration.enabled | quote }}
  TRUSTED_PROXY_HOPS: {{ .Values.backend.trustedProxy.hops | quote }}
  TRUSTED_PROXIES: {{ .Values.backend.trustedProxy.cidrs | quote }}
  CORS_ALLOWED_ORIGINS: {{ default (printf "https://%s" (required "ingress.host is required (or set backend.allowedOrigins)" .Values.ingress.host)) .Values.backend.allowedOrigins | quote }}
