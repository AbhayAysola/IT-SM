apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "it-sm.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "it-sm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "it-sm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # Conventional scrape hints (honoured by annotation-based Prometheus setups; a ServiceMonitor would replace them).
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.backend.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
              name: http
            - containerPort: {{ .Values.backend.managementPort }}
              name: management
          envFrom:
            - configMapRef:
                name: {{ include "it-sm.fullname" . }}-backend-config
            - secretRef:
                name: {{ include "it-sm.fullname" . }}-backend-secret
          # Spring Boot probe groups (backend/src/main/resources/application.yml). Actuator is served on the separate management port, which
          # no Service or Ingress exposes, so these are reachable by the kubelet (and, for metrics, Prometheus) only.
          #  * startup:   gives boot + Flyway migrations up to 5s x 36 = 180s (200m CPU request) before liveness takes over, so a slow
          #               start is never mistaken for a dead process.
          #  * liveness:  the process itself. Does NOT include PostgreSQL: a dependency outage must not restart pods.
          #  * readiness: accepting traffic AND PostgreSQL answers.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
