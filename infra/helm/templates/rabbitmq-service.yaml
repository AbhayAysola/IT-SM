apiVersion: v1
kind: Service
metadata:
  name: {{ include "it-sm.fullname" . }}-rabbitmq
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
      protocol: TCP
    - port: 15672
      targetPort: 15672
      name: management
      protocol: TCP
  selector:
    {{- include "it-sm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
