apiVersion: v1
kind: Service
metadata:
  name: {{ include "it-sm.fullname" . }}-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
      protocol: TCP
  selector:
    {{- include "it-sm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
