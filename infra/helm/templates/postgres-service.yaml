apiVersion: v1
kind: Service
metadata:
  name: {{ include "it-sm.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "it-sm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
      protocol: TCP
  selector:
    {{- include "it-sm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
