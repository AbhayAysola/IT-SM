global:
  namespace: it-sm
  imageRegistry: ""

frontend:
  image:
    repository: it-sm/frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 3000
  # There is deliberately NO api URL value here. The browser-facing API origin is compiled into the IMAGE by `next build`
  # (frontend/Dockerfile, --build-arg NEXT_PUBLIC_API_URL=https://<ingress.host>: the bare origin, no /api). Build the image with the
  # same host you set in `ingress.host`; changing an environment variable on the running pod cannot change it.

backend:
  image:
    repository: it-sm/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 8080
  # Actuator (health probes and /actuator/prometheus) is served on this separate port. It is never published by the Service or the
  # Ingress; the NetworkPolicy lets only the kubelet and the Prometheus pods in `networkPolicy.prometheus` reach it.
  managementPort: 8081
  # Optional: enables AI categorisation, duplicate hints and the chatbot (Google Gemini). Empty = those features are off.
  gemini:
    apiKey: ""
  jwt:
    secret: ""   # REQUIRED: >= 32 bytes of random secret (set via --set / a secret manager); the chart fails without it
    expiration: 86400000
  # Public origin(s) of the web app (comma separated, exact). REQUIRED for the browser session: cookie-authenticated writes and the web login
  # are refused from any other Origin. The session cookie is Secure, so serve the app over HTTPS (the dev profile is never active here).
  # Leave empty to use https://<ingress.host> (recommended: it cannot drift from the ingress). Set it only to allow additional origins.
  allowedOrigins: ""
  registration:
    enabled: false   # public self-registration; keep OFF until email verification exists (see docs/architecture/security.md)
  trustedProxy:
    # Proxies in front of the backend that YOU operate (the ingress = 1). Needed so the login/registration rate limits are charged
    # to the real client address instead of the ingress pod. Narrow `cidrs` to the ingress controller's pod CIDR.
    hops: 1
    # REQUIRED, no default: the pod CIDR (or the exact addresses) of the ingress controller that forwards to the backend. X-Forwarded-For is
    # trusted from these addresses ONLY, so a broad range lets any pod in it forge a client address and dodge the per-email login limit.
    # Kind with scripts/setup-kind.sh: the default pod network, 10.244.0.0/16. Anything else: look at your CNI / ingress controller.
    cidrs: ""

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  storage: 5Gi
  database: itsm
  username: itsm
  password: ""   # REQUIRED: choose a strong password (--set postgres.password=...); the chart fails without it

redis:
  image:
    repository: redis
    tag: "7-alpine"
  password: ""   # REQUIRED

rabbitmq:
  image:
    repository: rabbitmq
    tag: "3-management-alpine"
  username: itsm
  password: ""   # REQUIRED
  vhost: /

ingress:
  enabled: true
  className: nginx
  # PLACEHOLDER, not a real domain: replace with your public hostname. Required (the chart fails if it is empty).
  host: it-sm.local
  # HTTPS only (the session cookie is Secure). Nothing here creates or issues a certificate.
  tls:
    # REQUIRED: name of an existing kubernetes.io/tls Secret in the release namespace (`global.namespace`) holding a certificate valid
    # for `host`. The chart fails while this is empty. Create the Secret yourself (no certificate material belongs in this repository):
    #   kubectl -n it-sm create secret tls <name> --cert=<tls.crt> --key=<tls.key>
    secretName: ""
  # Optional extra annotations, e.g. your own certificate-issuer annotation. No issuer is assumed. The chart's own annotations
  # (ssl-redirect "true", proxy-body-size) cannot be overridden here.
  annotations: {}

# Ingress-only policies: who may open a connection to whom. Egress is not restricted. Needs a CNI that enforces NetworkPolicy
# (Kind's default kindnet does from v0.20; Calico and Cilium do). Without one the objects are accepted and ignored.
networkPolicy:
  enabled: true
  # Namespace of the ingress controller that forwards to the frontend and the backend.
  ingressControllerNamespace: ingress-nginx
  # Where the pods that scrape the backend's management port run, and how they are labelled. Nothing else can reach that port.
  prometheus:
    namespace: monitoring
    podLabels:
      app.kubernetes.io/name: prometheus

# In-cluster observability, OFF by default (scripts/deploy.sh turns it on when GRAFANA_ADMIN_PASSWORD is set). Prometheus runs in the release
# namespace and discovers the backend pods itself; Grafana is provisioned with the Prometheus datasource and the IT-SM operations dashboard
# (infra/helm/dashboards/itsm-overview.json: keep it identical to infra/monitoring/grafana/dashboards/itsm-overview.json). Neither is on the
# Ingress: use `kubectl port-forward`. Storage is an emptyDir: history is lost when a pod restarts (use a PVC for anything beyond a demo).
monitoring:
  prometheus:
    enabled: false
    image:
      repository: prom/prometheus
      tag: v2.51.0
    retention: 7d
  grafana:
    enabled: false
    image:
      repository: grafana/grafana
      tag: 10.4.0
    adminPassword: ""   # REQUIRED when enabled: no default password is shipped
