name: Container images

# Builds both images on every PR (so a broken Dockerfile is caught before merge), scans them with Trivy, and publishes them to GHCR
# from main only. Not path filtered, for the same reason as backend.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build, scan${{ github.event_name == 'push' && ', publish' || '' }} (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # GHCR push (main only; PRs never log in)
      security-events: write   # upload the Trivy SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            build-args: ''
          - name: frontend
            context: frontend
            # The API origin is compiled into the frontend bundle. This image is the local-development default; a deployment must
            # rebuild with its own host (scripts/setup-kind.sh does).
            build-args: |
              NEXT_PUBLIC_API_URL=http://localhost:8080
              NEXT_PUBLIC_INCIDENTS_API=live
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image name (lower case, as GHCR requires)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Build (loaded locally for the scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Lists fixable HIGH and CRITICAL vulnerabilities in the OS packages and the application's dependencies (unfixed ones are
      # ignored: nothing to act on until upstream publishes a fix). Report-only for now: main already carries known findings
      # (Spring Boot 3.3.1, Next 14.2.5, base images), tracked in issue #40. Set exit-code back to '1' once
      # those upgrades land, so new vulnerabilities fail the PR again.
      - name: Trivy scan (report fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'
          format: table

      - name: Trivy report for code scanning
        if: always() && github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (main only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
