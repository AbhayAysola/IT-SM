name: Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [feat/frontend-design-system]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    name: Lint, typecheck, contrast, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches frontend/Dockerfile (node:20-alpine)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Contrast
        run: npm run check:contrast

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      # `test:e2e` runs `next build`, then Playwright starts two production servers from that build (:3000 and
      # :3002 with ENABLE_DESIGN_SYSTEM=true) and waits for both before testing (playwright.config.ts). The suite is
      # hermetic: the API is faked in the browser (e2e/fixtures.ts), so no backend or database is needed.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
